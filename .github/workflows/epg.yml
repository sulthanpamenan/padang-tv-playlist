name: Generate EPG XMLTV

on:
  schedule:
    - cron: '30 17,5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Generate XMLTV EPG
        run: python generate_epg.py

      - name: Commit and Push EPG Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto refresh EPG [skip ci]" && git pull --rebase && git push)
